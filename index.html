<!doctype html>
<html lang="pt-BR" data-theme="light" data-accent="azul" data-density="normal" data-side="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiscoGCS</title>
<meta name="description" content="Gestão de riscos da cadeia global de suprimentos: mapa da rede, matriz de riscos, plano de ações, indicadores-chave e simulações.">
<meta name="theme-color" content="#ffffff">
<script>
  /* Aplica o tema salvo antes da primeira pintura (evita piscar claro/escuro) */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('riscogcs-ui') || '{}');
      var m = p.mode || 'system';
      var d = m === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
      var r = document.documentElement;
      r.setAttribute('data-theme', d);
      r.setAttribute('data-accent', p.accent || 'azul');
      r.setAttribute('data-density', p.density || 'normal');
      r.setAttribute('data-side', p.side || 'full');
    } catch (e) { /* sem armazenamento: usa o padrão */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu principal">
    <div class="side-top">
      <a class="brand" href="#painel" aria-label="RiscoGCS — início">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" class="bm-bg"/>
          <path d="M16 6.5 24.5 10v6.2c0 4.9-3.5 8.3-8.5 9.8-5-1.5-8.5-4.9-8.5-9.8V10Z" class="bm-shield"/>
          <path d="M12 16.4h2.6l1.6-3.2 2 6 1.4-2.8H21" class="bm-pulse"/>
        </svg>
        <span class="brand-txt"><b>RiscoGCS</b><small>Gestão de riscos da cadeia</small></span>
      </a>
      <button class="side-toggle" id="sideToggle" type="button" aria-label="Recolher menu" data-tip="Recolher ou expandir o menu"></button>
    </div>
    <nav class="side-nav" id="tabs" aria-label="Seções"></nav>
    <div class="side-foot">
      <div class="mode-switch" id="modeSwitch" role="group" aria-label="Tema"></div>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="shell">
    <header class="top">
      <button class="icon-btn only-mobile" id="navOpen" type="button" aria-label="Abrir menu"></button>
      <div class="search" id="searchBox">
        <span class="search-ic" aria-hidden="true"></span>
        <input id="searchInput" type="search" placeholder="Buscar riscos, ações, elos, indicadores ou fornecedores" autocomplete="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="searchList" aria-autocomplete="list" aria-label="Buscar no sistema">
        <kbd class="search-kbd">Ctrl K</kbd>
        <div class="pop search-pop" id="searchPop" hidden><ul id="searchList" role="listbox" aria-label="Resultados"></ul></div>
      </div>
      <div class="top-tools">
        <button class="icon-btn top-btn" id="helpBtn" type="button" aria-label="Ajuda" aria-haspopup="menu" data-tip="Ajuda: tour, guia e glossário"></button>
        <button class="icon-btn top-btn" id="themeBtn" type="button" aria-label="Alternar tema claro e escuro" data-tip="Alternar tema claro/escuro"></button>
        <button class="icon-btn top-btn" id="paletteBtn" type="button" aria-label="Aparência" data-tip="Aparência: tema, cor e densidade"></button>
        <button class="icon-btn top-btn bell" id="bellBtn" type="button" aria-label="Notificações" aria-haspopup="dialog" data-tip="Notificações"><span class="bell-n" id="bellN" hidden></span></button>
        <span class="top-sep" aria-hidden="true"></span>
        <button class="who" id="whoBtn" type="button" aria-label="Organização e preferências" data-tip="Organização e preferências">
          <span class="avatar" id="companyAvatar" aria-hidden="true">NE</span>
          <span class="who-txt"><b id="companyName">NordEletro S.A.</b><small>Base de demonstração</small></span>
          <span class="who-chev" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="main" id="main">
      <div class="page-head">
        <div class="ph-in">
          <nav class="crumbs" id="crumbs" aria-label="Você está em"></nav>
          <div class="ph-row">
            <div class="ph-txt">
              <div class="ph-title"><h1 id="pageTitle">Visão geral</h1><span id="titleBadge"></span></div>
              <p id="pageSub"></p>
            </div>
            <div class="ph-actions">
              <button class="btn btn-quiet" id="btnGuide" type="button" aria-haspopup="dialog"></button>
              <button class="btn btn-primary" id="btnPrimary" type="button" hidden></button>
            </div>
          </div>
          <div class="ph-tabs" id="phTabs"></div>
        </div>
      </div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="popRoot"></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/model.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/extras.js"></script>
<script src="assets/js/tour.js"></script>
</body>
</html>
